<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বিডি বাজার | BD BAZAAR - অনলাইন কেনাবেচার মার্কেটপ্লেস</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #f59e0b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --whatsapp: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }

    /* Navbar */
    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .logo { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .logo span { background: var(--accent); color: #000; padding: 2px 7px; border-radius: 6px; font-size: 13px; }
    .nav-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-light { background: #fff; color: var(--primary); }
    .btn-light:hover { background: #e2e8f0; }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-accent:hover { background: #d97706; color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 11px; font-size: 15px; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--danger); color: #fff; font-size: 12px; padding: 6px 10px; }

    /* Search & Filter */
    .container { max-width: 1100px; margin: 18px auto; padding: 0 14px; }
    .filter-bar {
      background: var(--card);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 18px;
    }
    @media (max-width: 600px) {
      .filter-bar { grid-template-columns: 1fr; }
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.15s;
    }
    .card:hover { transform: translateY(-2px); }
    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e2e8f0;
    }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge {
      display: inline-block;
      background: #ccfbf1;
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 6px;
      width: fit-content;
    }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .card-price { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .card-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .card-desc { font-size: 13px; color: #334155; margin-bottom: 12px; line-height: 1.4; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .btn-call { background: var(--primary); color: #fff; text-decoration: none; padding: 7px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; flex: 1; text-align: center; }
    .btn-wa { background: var(--whatsapp); color: #fff; text-decoration: none; padding: 7px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; flex: 1; text-align: center; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .close-btn { background: #e2e8f0; color: #000; padding: 4px 10px; border-radius: 6px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .tab-switch { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-switch button { flex: 1; background: #e2e8f0; color: #334155; }
    .tab-switch button.active { background: var(--primary); color: #fff; }
    .empty-state { text-align: center; padding: 40px 15px; color: var(--muted); grid-column: 1 / -1; }
    .user-pill { font-size: 12px; background: rgba(255,255,255,0.18); padding: 6px 10px; border-radius: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">🛒 বিডি বাজার <span>BD BAZAAR</span></div>
      <div class="nav-actions">
        <span id="userEmailDisplay" class="user-pill" style="display:none;"></span>
        <button id="postAdBtn" class="btn-accent" onclick="openPostModal()">+ বিজ্ঞাপন দিন</button>
        <button id="authBtn" class="btn-light" onclick="openAuthModal()">লগইন / সাইনআপ</button>
        <button id="logoutBtn" class="btn-light" style="display:none;" onclick="logoutUser()">লগআউট</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="কী খুঁজছেন? (যেমন: মোবাইল, বাইক, ফার্নিচার, পোশাক...)" oninput="renderProducts()" />
      <select id="categoryFilter" onchange="renderProducts()">
        <option value="all">সব ক্যাটাগরি</option>
        <option value="মোবাইল ও গ্যাজেট">মোবাইল ও গ্যাজেট</option>
        <option value="পোশাক ও ফ্যাশন">পোশাক ও ফ্যাশন</option>
        <option value="ইলেকট্রনিক্স">ইলেকট্রনিক্স</option>
        <option value="গাড়ি ও বাইক">গাড়ি ও বাইক</option>
        <option value="ফার্নিচার ও ঘর">ফার্নিচার ও ঘর</option>
        <option value="কৃষি ও খাদ্য">কৃষি ও খাদ্য</option>
        <option value="অন্যান্য">অন্যান্য</option>
      </select>
    </div>

    <div id="productGrid" class="grid">
      <div class="empty-state">পণ্য লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="authTitle">অ্যাকাউন্টে লগইন করুন</h3>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      <div class="tab-switch">
        <button id="loginTab" class="active" onclick="switchAuthMode('login')">লগইন</button>
        <button id="signupTab" onclick="switchAuthMode('signup')">নতুন অ্যাকাউন্ট</button>
      </div>
      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group" id="nameGroup" style="display:none;">
          <label>আপনার নাম</label>
          <input type="text" id="userName" placeholder="যেমন: হৃদয় খান" />
        </div>
        <div class="form-group">
          <label>ইমেইল ঠিকানা</label>
          <input type="email" id="userEmail" required placeholder="example@gmail.com" />
        </div>
        <div class="form-group">
          <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
          <input type="password" id="userPassword" required minlength="6" placeholder="******" />
        </div>
        <button type="submit" class="btn-primary" id="authSubmitBtn">লগইন করুন</button>
      </form>
    </div>
  </div>

  <!-- Post Product Modal -->
  <div id="postModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>নতুন পণ্য বিক্রি করুন</h3>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      <form id="postForm" onsubmit="handlePostProduct(event)">
        <div class="form-group">
          <label>পণ্যের নাম *</label>
          <input type="text" id="pTitle" required placeholder="যেমন: iPhone XS 64GB ভালো কন্ডিশন" />
        </div>
        <div class="form-group">
          <label>ক্যাটাগরি *</label>
          <select id="pCategory" required>
            <option value="মোবাইল ও গ্যাজেট">মোবাইল ও গ্যাজেট</option>
            <option value="পোশাক ও ফ্যাশন">পোশাক ও ফ্যাশন</option>
            <option value="ইলেকট্রনিক্স">ইলেকট্রনিক্স</option>
            <option value="গাড়ি ও বাইক">গাড়ি ও বাইক</option>
            <option value="ফার্নিচার ও ঘর">ফার্নিচার ও ঘর</option>
            <option value="কৃষি ও খাদ্য">কৃষি ও খাদ্য</option>
            <option value="অন্যান্য">অন্যান্য</option>
          </select>
        </div>
        <div class="form-group">
          <label>দাম (টাকায়) *</label>
          <input type="number" id="pPrice" required placeholder="যেমন: 18500" />
        </div>
        <div class="form-group">
          <label>আপনার এলাকা / জেলা *</label>
          <input type="text" id="pLocation" required placeholder="যেমন: কামরাঙ্গীরচর, ঢাকা / শরীয়তপুর" />
        </div>
        <div class="form-group">
          <label>মোবাইল / WhatsApp নম্বর *</label>
          <input type="tel" id="pPhone" required placeholder="017XXXXXXXX" />
        </div>
        <div class="form-group">
          <label>পণ্যের ছবি আপলোড করুন *</label>
          <input type="file" id="pImageFile" accept="image/*" required />
        </div>
        <div class="form-group">
          <label>পণ্যের বিস্তারিত বিবরণ</label>
          <textarea id="pDesc" rows="3" placeholder="পণ্যের অবস্থা, কতদিন ব্যবহৃত হয়েছে ইত্যাদি লিখুন..."></textarea>
        </div>
        <button type="submit" class="btn-primary" id="postSubmitBtn">বিজ্ঞাপন প্রকাশ করুন</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsGBfAsK_V_TL68YOpMRrqcA_ck2FgYzQ",
      authDomain: "bd-bazaar-bf3f2.firebaseapp.com",
      databaseURL: "https://bd-bazaar-bf3f2-default-rtdb.firebaseio.com",
      projectId: "bd-bazaar-bf3f2",
      storageBucket: "bd-bazaar-bf3f2.firebasestorage.app",
      messagingSenderId: "837350355578",
      appId: "1:837350355578:web:8233d9daa1f4487add01c3",
      measurementId: "G-PP2JRRTG54"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let authMode = 'login';
    let allProducts = [];

    // Monitor Auth State
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const authBtn = document.getElementById('authBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const userEmailDisplay = document.getElementById('userEmailDisplay');

      if (user) {
        authBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        userEmailDisplay.style.display = 'inline-block';
        userEmailDisplay.textContent = user.displayName || user.email;
      } else {
        authBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        userEmailDisplay.style.display = 'none';
      }
      renderProducts();
    });

    // Load Products Realtime
    const productsRef = ref(db, 'products');
    onValue(productsRef, (snapshot) => {
      const data = snapshot.val();
      allProducts = [];
      if (data) {
        Object.keys(data).forEach((key) => {
          allProducts.push({ id: key, ...data[key] });
        });
        allProducts.reverse();
      }
      renderProducts();
    }, (error) => {
      document.getElementById('productGrid').innerHTML = `<div class="empty-state">ডাটা লোড করতে সমস্যা হচ্ছে। Firebase Realtime Database Rules চেক করুন।</div>`;
    });

    // Render Products
    window.renderProducts = function() {
      const grid = document.getElementById('productGrid');
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;

      const filtered = allProducts.filter(item => {
        const matchCat = cat === 'all' || item.category === cat;
        const matchQuery = item.title.toLowerCase().includes(query) ||
                           (item.location && item.location.toLowerCase().includes(query)) ||
                           (item.desc && item.desc.toLowerCase().includes(query));
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">কোনো পণ্য পাওয়া যায়নি। প্রথম বিজ্ঞাপনটি আপনিই দিন!</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const cleanPhone = (item.phone || '').replace(/[^0-9]/g, '');
        const waPhone = cleanPhone.startsWith('88') ? cleanPhone : '88' + cleanPhone;
        const isOwner = currentUser && currentUser.uid === item.uid;

        return `
          <div class="card">
            <img src="${item.image}" alt="${item.title}" />
            <div class="card-body">
              <div>
                <span class="badge">${item.category}</span>
                <div class="card-title">${item.title}</div>
                <div class="card-price">৳ ${Number(item.price).toLocaleString('bn-BD')}</div>
                <div class="card-meta">📍 ${item.location} • 👤 ${item.sellerName || 'বিক্রেতা'}</div>
                <div class="card-desc">${item.desc || ''}</div>
              </div>
              <div class="card-actions">
                <a href="tel:${cleanPhone}" class="btn-call">📞 কল করুন</a>
                <a href="https://wa.me/${waPhone}?text=আসসালামু আলাইকুম, বিডি বাজারে আপনার '${encodeURIComponent(item.title)}' পণ্যটি কিনতে আগ্রহী।" target="_blank" class="btn-wa">💬 WhatsApp</a>
                ${isOwner ? `<button class="btn-danger" onclick="deleteProduct('${item.id}')">ডিলিট</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    };

    // Compress Image to Base64 so no external API key is needed
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 600;
            const scale = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
        reader.onerror = error => reject(error);
      });
    }

    // Handle Post Product
    window.handlePostProduct = async function(e) {
      e.preventDefault();
      if (!currentUser) {
        alert('পণ্য পোস্ট করতে আগে লগইন করুন!');
        openAuthModal();
        return;
      }

      const btn = document.getElementById('postSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'আপলোড হচ্ছে...';

      try {
        const file = document.getElementById('pImageFile').files[0];
        const compressedImg = await compressImage(file);

        const newProductRef = push(ref(db, 'products'));
        await set(newProductRef, {
          uid: currentUser.uid,
          sellerName: currentUser.displayName || currentUser.email.split('@')[0],
          title: document.getElementById('pTitle').value,
          category: document.getElementById('pCategory').value,
          price: document.getElementById('pPrice').value,
          location: document.getElementById('pLocation').value,
          phone: document.getElementById('pPhone').value,
          desc: document.getElementById('pDesc').value,
          image: compressedImg,
          createdAt: Date.now()
        });

        document.getElementById('postForm').reset();
        closeModals();
        alert('আপনার বিজ্ঞাপনটি সফলভাবে প্রকাশিত হয়েছে!');
      } catch (err) {
        alert('সমস্যা হয়েছে: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'বিজ্ঞাপন প্রকাশ করুন';
      }
    };

    // Delete Own Product
    window.deleteProduct = async function(id) {
      if (confirm('আপনি কি নিশ্চিতভাবে এই বিজ্ঞাপনটি মুছে ফেলতে চান?')) {
        await remove(ref(db, 'products/' + id));
      }
    };

    // Auth Handlers
    window.openAuthModal = function() {
      closeModals();
      document.getElementById('authModal').classList.add('active');
    };

    window.openPostModal = function() {
      if (!currentUser) {
        alert('বিজ্ঞাপন দেওয়ার জন্য আগে লগইন বা নতুন অ্যাকাউন্ট খুলুন।');
        openAuthModal();
        return;
      }
      closeModals();
      document.getElementById('postModal').classList.add('active');
    };

    window.closeModals = function() {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    };

    window.switchAuthMode = function(mode) {
      authMode = mode;
      document.getElementById('loginTab').classList.toggle('active', mode === 'login');
      document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
      document.getElementById('nameGroup').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('authTitle').textContent = mode === 'login' ? 'অ্যাকাউন্টে লগইন করুন' : 'নতুন অ্যাকাউন্ট খুলুন';
      document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'লগইন করুন' : 'সাইনআপ করুন';
    };

    window.handleAuth = async function(e) {
      e.preventDefault();
      const email = document.getElementById('userEmail').value;
      const password = document.getElementById('userPassword').value;
      const name = document.getElementById('userName').value;

      try {
        if (authMode === 'signup') {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          if (name) {
            await updateProfile(cred.user, { displayName: name });
          }
          alert('অ্যাকাউন্ট তৈরি সফল হয়েছে!');
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        closeModals();
      } catch (err) {
        alert('ত্রুটি: ' + err.message);
      }
    };

    window.logoutUser = async function() {
      await signOut(auth);
      alert('লগআউট সম্পন্ন হয়েছে।');
    };
  </script>
</body>
</html>
